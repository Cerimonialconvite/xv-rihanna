<style>
  :root{ --ouro:#CBA45E; --ouro-escuro:#A9823F; --papel:#DCE9F7; --u:0.5px; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--papel);height:100%}
  body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ouro);-webkit-tap-highlight-color:transparent;overflow-x:hidden}

  /* ---------- abertura ---------- */
  .tela{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#9cc3ee;z-index:10;transition:opacity .9s ease}
  .tela.oculta{opacity:0;pointer-events:none}
  #animacao.suave{transition:opacity 1.6s ease}
  .quadro{position:relative;height:100%;width:100%;max-width:calc(100vh * 9 / 16);max-height:calc(100vw * 16 / 9)}
  .quadro img,.quadro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .fundo-tela{position:absolute;inset:-60px;background:url(img/capa.jpg) center/cover;filter:blur(28px) saturate(.9);opacity:.9}
  #capa{cursor:pointer}
  #capa .pulso{position:absolute;left:50%;top:76.5%;width:66%;height:10%;transform:translate(-50%,-50%);border-radius:60px;animation:pulso 2.4s ease-in-out infinite}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(255,250,235,0)}50%{box-shadow:0 0 40px 10px rgba(255,250,235,.28)}}
  #pular{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:8px 14px;border:1px solid rgba(203,164,94,.6);border-radius:30px;background:rgba(250,246,236,.75);color:var(--ouro-escuro);font:500 15px "Cormorant Garamond",serif;letter-spacing:.08em;opacity:0;transition:opacity .6s}
  #animacao.mostra-pular #pular{opacity:1}
  #clarao{position:fixed;inset:0;background:#fbfaf6;opacity:0;pointer-events:none;z-index:20;transition:opacity .7s ease}

  /* ---------- convite ---------- */
  #convite{max-width:540px;margin:0 auto;background:var(--papel)}
  .arte{position:relative;width:100%;aspect-ratio:1080/7261;overflow:hidden}
  .arte>img.fundo{display:block;width:100%;height:auto}
  .camada{position:absolute;inset:0}
  .camada>*{position:absolute;height:auto;display:block}

  /* flores: entram pelas bordas e ficam numa brisa leve */
  .flor{opacity:0;transition:opacity 1.6s ease,transform 2s cubic-bezier(.2,.7,.2,1)}
  .flor.esq{transform:translateX(-16%) scale(.94)}
  .flor.dir{transform:translateX(16%) scale(.94)}
  .flor.visto{opacity:1;transform:none}
  .flor img{display:block;width:100%;height:auto;animation:brisa 7.5s ease-in-out infinite alternate}
  .flor.esq img{transform-origin:0% 55%}
  .flor.dir img{transform-origin:100% 55%;animation-name:brisa2}
  @keyframes brisa{0%{transform:rotate(-1.3deg)}100%{transform:rotate(1.5deg)}}
  @keyframes brisa2{0%{transform:rotate(1.3deg)}100%{transform:rotate(-1.5deg)}}

  /* textos */
  .sobe{opacity:0;transform:translateY(calc(var(--u)*24));transition:opacity 1.1s ease,transform 1.1s ease}
  .sobe.visto{opacity:1;transform:none}
  .escrita{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 44%,transparent 56%,transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 44%,transparent 56%,transparent 100%);
    -webkit-mask-size:240% 100%;mask-size:240% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:100% 0;mask-position:100% 0;
    transition:-webkit-mask-position 2.4s cubic-bezier(.45,.1,.35,1),mask-position 2.4s cubic-bezier(.45,.1,.35,1)}
  .escrita.visto{-webkit-mask-position:0 0;mask-position:0 0}

  /* data em sequência */
  .d1{opacity:0;transform:translateY(calc(var(--u)*-20));transition:opacity 1s ease,transform 1s ease}
  .d2{transform:scaleX(0);transform-origin:50% 50%;transition:transform 1.3s cubic-bezier(.45,.1,.35,1) .45s}
  .d3{opacity:0;transition:opacity 1s ease .9s,transform 1s ease .9s}
  .da-esq{transform:translateX(calc(var(--u)*-34))}
  .da-dir{transform:translateX(calc(var(--u)*34))}
  .d4{opacity:0;transform:scale(.72);transition:opacity 1.1s ease 1.3s,transform 1.3s cubic-bezier(.2,.8,.25,1.15) 1.3s}
  .d5{opacity:0;transform:translateY(calc(var(--u)*20));transition:opacity 1s ease 1.8s,transform 1s ease 1.8s}
  .d1.visto,.d3.visto,.d4.visto,.d5.visto{opacity:1;transform:none}
  .d2.visto{transform:none}

  /* brilho dourado (logo e 31) */
  .brilho{pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    background:linear-gradient(105deg,rgba(255,248,225,0) 38%,rgba(255,248,225,.95) 50%,rgba(255,248,225,0) 62%);background-size:300% 100%;background-repeat:no-repeat;background-position:90% 0;opacity:0}
  .brilho.ativo{opacity:1;animation:reflexo 6s ease-in-out infinite}
  .d-brilho.visto{opacity:1;animation:reflexo 6.5s ease-in-out 3.2s infinite}
  @keyframes reflexo{0%{background-position:90% 0}26%{background-position:10% 0}100%{background-position:10% 0}}

  /* ilustrações em aquarela */
  .aquarela{width:auto}

  /* logo animado */
  #logo{overflow:visible}
  #logo path{fill:url(#ouro)}
  #logo .r,#logo .f{fill-opacity:0;stroke:var(--ouro);stroke-width:1.1;stroke-linejoin:round}
  #logo .l,#logo .x{opacity:0;transform:translateY(10px);transform-box:fill-box}
  #logo.anima .r{animation:traco 1.5s cubic-bezier(.45,.05,.3,1) forwards, preenche .9s ease 1.1s forwards}
  #logo.anima .f{animation:traco 1.8s cubic-bezier(.45,.05,.3,1) .5s forwards, preenche .9s ease 1.6s forwards}
  #logo.anima .l,#logo.anima .x{animation:surge .9s ease forwards}
  @keyframes traco{to{stroke-dashoffset:0}}
  @keyframes preenche{to{fill-opacity:1;stroke-opacity:0}}
  @keyframes surge{to{opacity:1;transform:none}}
  #logo.pronto path{fill-opacity:1!important;stroke-opacity:0!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}

  /* contagem regressiva (área reservada) */
  .contagem{left:0;right:0;top:76.9%;text-align:center}
  .contagem h2{font-family:"Pinyon Script",cursive;font-weight:400;color:var(--ouro);font-size:calc(var(--u)*150);line-height:1.05}
  .relogio{display:flex;justify-content:center;gap:calc(var(--u)*26);margin-top:calc(var(--u)*28);opacity:0;transform:translateY(calc(var(--u)*24));transition:opacity 1.1s ease 1.2s,transform 1.1s ease 1.2s}
  .contagem.visto .relogio{opacity:1;transform:none}
  .unidade{width:calc(var(--u)*170);padding:calc(var(--u)*18) 0 calc(var(--u)*14);border-top:1px solid rgba(203,164,94,.7);border-bottom:1px solid rgba(203,164,94,.7);perspective:400px}
  .unidade b{display:block;font-weight:300;font-size:calc(var(--u)*104);line-height:1;color:var(--ouro);font-variant-numeric:lining-nums tabular-nums}
  .unidade b.vira{animation:vira .5s cubic-bezier(.3,.7,.3,1)}
  @keyframes vira{0%{opacity:0;transform:rotateX(80deg) translateY(-18%)}100%{opacity:1;transform:none}}
  .unidade small{display:block;margin-top:calc(var(--u)*12);font-family:"Cinzel",serif;font-size:calc(var(--u)*24);letter-spacing:.14em;text-transform:uppercase;color:var(--ouro)}
  .chegou{display:none;margin-top:calc(var(--u)*30);font-family:"Pinyon Script",cursive;font-size:calc(var(--u)*96);color:var(--ouro)}

  /* ícones clicáveis */
  .ponto{width:21.2%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;border:0;background:transparent}
  .ponto:focus-visible{outline:2px solid var(--ouro);outline-offset:4px}
  .ponto::after{content:"";position:absolute;inset:0;border-radius:50%;animation:halo 2.6s ease-in-out infinite}
  @keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(203,164,94,0)}50%{box-shadow:0 0 24px 7px rgba(203,164,94,.4)}}

  /* pétalas caindo */
  #petalas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:0;transition:opacity 2s ease}
  #petalas.ativo{opacity:1}

  /* confirmação de presença dentro do convite */
  #rsvp{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(40,60,100,.45);backdrop-filter:blur(3px)}
  #rsvp.aberto{display:flex}
  #rsvp .janela{position:relative;height:min(92vh,calc(92vw * 16 / 9));aspect-ratio:9/16;max-width:96vw;background:#fbfaf6;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(20,40,80,.35)}
  #rsvp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #rsvp .aviso{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:22px;color:var(--ouro-escuro)}
  #rsvp .fechar{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid rgba(203,164,94,.6);background:rgba(251,250,246,.95);color:var(--ouro-escuro);font-size:22px;line-height:1;cursor:pointer}

  /* música */
  #som{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid rgba(203,164,94,.55);background:rgba(251,250,246,.88);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(40,70,120,.15)}
  #som.ativo{display:flex}
  #som svg{width:22px;height:22px;fill:none;stroke:var(--ouro-escuro);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #som .off{display:none} #som.mudo .on{display:none} #som.mudo .off{display:block}

  @media (prefers-reduced-motion: reduce){
    #petalas{display:none}
    .flor img{animation:none}
    .flor,.sobe,.d1,.d3,.d4,.d5{opacity:1!important;transform:none!important;transition:none!important}
    .escrita{-webkit-mask-image:none;mask-image:none}
    .d2{transform:none!important}
  }
</style>
</head>

<script>
(function(){
  /* ===== AJUSTES ===== */
  var LINK_CONFIRMACAO = ''; // cole aqui o link do Google Forms
  var DATA_FESTA = '2027-01-31T21:00:00-03:00';
  var INICIO_TRANSICAO = 5.3; // segundo do vídeo em que o convite começa a aparecer (antes do papel branco)

  var capa=document.getElementById('capa'), anim=document.getElementById('animacao'),
      video=document.getElementById('video'), clarao=document.getElementById('clarao'),
      convite=document.getElementById('convite'), musica=document.getElementById('musica'),
      som=document.getElementById('som'), logo=document.getElementById('logo'),
      aberto=false, terminou=false, temMusica=true;
  var semMovimento=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  var arte=document.getElementById('arte');
  function escala(){ var w=arte.getBoundingClientRect().width||Math.min(window.innerWidth,540); document.documentElement.style.setProperty('--u',(w/1080)+'px'); }
  window.addEventListener('resize',escala); escala();

  /* ---------- música (toca se existir musica.mp3) ---------- */
  musica.addEventListener('error',function(){ temMusica=false; som.classList.remove('ativo'); });
  function fadeIn(){ musica.volume=0; var v=0; var t=setInterval(function(){ v+=0.05; musica.volume=Math.min(v,0.85); if(v>=0.85) clearInterval(t); },150); }
  function tocar(){
    if(!temMusica) return;
    var p=musica.play();
    if(p&&p.then) p.then(function(){ som.classList.add('ativo'); fadeIn(); }).catch(function(){ if(temMusica&&musica.readyState>0) som.classList.add('ativo','mudo'); });
  }
  som.addEventListener('click',function(){
    if(musica.paused){ musica.play(); som.classList.remove('mudo'); som.setAttribute('aria-label','Pausar música'); }
    else { musica.pause(); som.classList.add('mudo'); som.setAttribute('aria-label','Tocar música'); }
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden && !musica.paused){ musica.pause(); musica.dataset.retomar='1'; }
    else if(!document.hidden && musica.dataset.retomar){ musica.play(); delete musica.dataset.retomar; }
    pausado=document.hidden;
  });

  /* ---------- abertura: capa -> vídeo -> convite ---------- */
  try{ video.load(); }catch(e){}
  video.addEventListener('error',function(){ if(aberto) mostrarConvite(false); });
  function abrir(){
    if(aberto) return; aberto=true;
    tocar();
    if(video.error || video.networkState===3){ mostrarConvite(false); return; }
    anim.classList.remove('oculta'); capa.classList.add('oculta');
    var p=video.play(); if(p&&p.catch) p.catch(function(){ mostrarConvite(false); });
    setTimeout(function(){ anim.classList.add('mostra-pular'); },1500);
    setTimeout(function(){ mostrarConvite(true); },(INICIO_TRANSICAO+3)*1000);
  }
  video.addEventListener('timeupdate',function(){ if(video.currentTime>=INICIO_TRANSICAO) mostrarConvite(true); });
  video.addEventListener('ended',function(){ mostrarConvite(true); });
  document.getElementById('pular').addEventListener('click',function(){ mostrarConvite(true); });

  function mostrarConvite(suave){
    if(terminou) return; terminou=true;
    if(suave){
      /* o convite aparece por baixo e o vídeo se dissolve nele */
      convite.hidden=false; window.scrollTo(0,0); escala(); iniciarTudo();
      anim.classList.add('suave');
      requestAnimationFrame(function(){ anim.classList.add('oculta'); });
      setTimeout(function(){ try{ video.pause(); }catch(e){} capa.remove(); anim.remove(); },1800);
      return;
    }
    clarao.style.opacity='1';
    setTimeout(function(){
      convite.hidden=false; window.scrollTo(0,0); escala();
      anim.classList.add('oculta'); capa.classList.add('oculta');
      iniciarTudo(); clarao.style.opacity='0';
      setTimeout(function(){ capa.remove(); anim.remove(); },1000);
    },650);
  }
  capa.addEventListener('click',abrir);
  capa.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrir(); } });

  function iniciarTudo(){ iniciarLogo(); iniciarEntradas(); iniciarPetalas(); }

  /* ---------- logo animado (SVG) + brilho ---------- */
  function iniciarLogo(){
    var brilhoLogo=document.getElementById('brilho-logo');
    if(semMovimento){ logo.classList.add('pronto'); return; }
    logo.querySelectorAll('.r,.f').forEach(function(p){ var L=Math.ceil(p.getTotalLength()); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });
    var base=1.3;
    logo.querySelectorAll('.l').forEach(function(p,i){ p.style.animationDelay=(base+i*0.09)+'s'; });
    logo.querySelectorAll('.x').forEach(function(p,i){ p.style.animationDelay=(base+0.75+i*0.06)+'s'; });
    setTimeout(function(){ logo.classList.add('anima'); },600);
    setTimeout(function(){ logo.classList.add('pronto'); brilhoLogo.classList.add('ativo'); },5400);
  }

  /* ---------- entradas ao rolar ---------- */
  function iniciarEntradas(){
    var itens=document.querySelectorAll('[data-anim]');
    if(semMovimento || !('IntersectionObserver' in window)){ itens.forEach(revelar); return; }
    var obs=new IntersectionObserver(function(es){ es.forEach(function(e){
      if(!e.isIntersecting) return; revelar(e.target); obs.unobserve(e.target);
    }); },{threshold:0.01, rootMargin:'0px 0px -6% 0px'});
    itens.forEach(function(el){ obs.observe(el); });
  }
  function revelar(el){
    if(el.classList.contains('aquarela')) pintarAquarela(el);
    el.classList.add('visto');
  }

  /* ---------- ilustrações pintadas em aquarela ---------- */
  var imagens={};
  function carregar(src){ if(!imagens[src]){ imagens[src]=new Promise(function(ok){ var i=new Image(); i.onload=function(){ ok(i); }; i.src=src; }); } return imagens[src]; }
  document.querySelectorAll('canvas.aquarela').forEach(function(c){
    carregar(c.dataset.img).then(function(img){ c.width=img.naturalWidth; c.height=img.naturalHeight; c.style.aspectRatio=img.naturalWidth+' / '+img.naturalHeight; if(semMovimento) c.getContext('2d').drawImage(img,0,0); });
  });
  function pintarAquarela(c){
    if(c._feito) return; c._feito=true;
    carregar(c.dataset.img).then(function(img){
      var ctx=c.getContext('2d'), W=c.width, H=c.height;
      if(semMovimento){ ctx.drawImage(img,0,0); return; }
      var m=document.createElement('canvas'); m.width=W; m.height=H; var mc=m.getContext('2d');
      var faixas=Math.max(3,Math.ceil(H/120)), pinc=[], DUR=1600, ATRASO=220;
      for(var i=0;i<faixas;i++){ pinc.push({ y:(i+0.5)*H/faixas, esq:i%2===0, ini:i*ATRASO, ultimo:-1, onda:Math.random()*6, amp:14+Math.random()*20, r:H/faixas*0.95+26 }); }
      var total=(faixas-1)*ATRASO+DUR, t0=null;
      function borrao(x,y,r){
        for(var k=0;k<3;k++){
          var rx=x+(Math.random()-.5)*r*.7, ry=y+(Math.random()-.5)*r*.6, rr=r*(.55+Math.random()*.6);
          var g=mc.createRadialGradient(rx,ry,rr*.15,rx,ry,rr);
          g.addColorStop(0,'rgba(0,0,0,.55)'); g.addColorStop(.6,'rgba(0,0,0,.28)'); g.addColorStop(1,'rgba(0,0,0,0)');
          mc.fillStyle=g; mc.beginPath(); mc.arc(rx,ry,rr,0,6.283); mc.fill();
        }
      }
      function quadro(t){
        if(t0===null) t0=t; var dt=t-t0;
        pinc.forEach(function(p){
          var prog=Math.min(1,Math.max(0,(dt-p.ini)/DUR)); if(prog<=0) return;
          prog=1-Math.pow(1-prog,2.2); var alvo=Math.floor(prog*40);
          for(var s=p.ultimo+1;s<=alvo;s++){ var u=s/40, x=-120+u*(W+240); if(!p.esq) x=W-x; borrao(x,p.y+Math.sin(u*5+p.onda)*p.amp,p.r); }
          p.ultimo=alvo;
        });
        var fim=Math.min(1,Math.max(0,(dt-total+300)/700));
        ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,W,H);
        ctx.drawImage(img,0,0);
        ctx.globalCompositeOperation='destination-in'; ctx.drawImage(m,0,0);
        if(fim>0){ ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=fim; ctx.clearRect(0,0,W,H); ctx.drawImage(img,0,0); ctx.globalAlpha=1; }
        if(fim<1) requestAnimationFrame(quadro); else { ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,W,H); ctx.drawImage(img,0,0); }
      }
      requestAnimationFrame(quadro);
    });
  }

  /* ---------- contagem regressiva com números virando ---------- */
  var alvo=new Date(DATA_FESTA).getTime(), rel=document.getElementById('relogio');
  var dois=function(n){ return (n<10?'0':'')+n; };
  function poe(id,v){ var el=document.getElementById(id); if(el.textContent===String(v)) return; el.textContent=v; el.classList.remove('vira'); void el.offsetWidth; el.classList.add('vira'); }
  (function atualiza(){
    var r=alvo-Date.now();
    if(r<=0){ rel.style.display='none'; document.getElementById('chegou').style.display='block'; return; }
    var s=Math.floor(r/1000);
    poe('d',Math.floor(s/86400)); poe('h',dois(Math.floor(s%86400/3600))); poe('m',dois(Math.floor(s%3600/60))); poe('s',dois(s%60));
    setTimeout(atualiza,1000);
  })();

  /* ---------- confirmação de presença dentro do convite ---------- */
  var rsvp=document.getElementById('rsvp'), janela=rsvp.querySelector('.janela'), frame=null;
  function linkEmbutido(u){
    if(!u) return '';
    if(/docs\.google\.com\/forms/.test(u)){ u=u.replace(/\/(viewform|edit)(\?.*)?$/,'/viewform'); return u+(u.indexOf('?')>-1?'&':'?')+'embedded=true'; }
    return u;
  }
  document.getElementById('abrir-rsvp').addEventListener('click',function(){
    var u=linkEmbutido(LINK_CONFIRMACAO);
    if(u && !frame){ frame=document.createElement('iframe'); frame.src=u; frame.title='Formulário de confirmação de presença'; janela.appendChild(frame); document.getElementById('rsvp-aviso').style.display='none'; }
    rsvp.classList.add('aberto'); document.body.style.overflow='hidden';
  });
  function fecharRsvp(){ rsvp.classList.remove('aberto'); document.body.style.overflow=''; }
  rsvp.querySelector('.fechar').addEventListener('click',fecharRsvp);
  rsvp.addEventListener('click',function(e){ if(e.target===rsvp) fecharRsvp(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') fecharRsvp(); });

  /* ---------- pétalas caindo (discretas) ---------- */
  var cv=document.getElementById('petalas'), ctx2=cv.getContext('2d'), dpr=1, W=0, H=0, petalas=[], sprites=[], rodando=false, pausado=false, ult=0;
  function tamanho(){ dpr=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx2.setTransform(dpr,0,0,dpr,0,0); }
  function criaSprite(c1,c2,c3){
    var s=document.createElement('canvas'), S=96; s.width=S; s.height=S; var g=s.getContext('2d');
    g.translate(S/2,S/2);
    g.beginPath(); g.moveTo(0,40);
    g.bezierCurveTo(-30,26,-42,-6,-30,-26); g.bezierCurveTo(-20,-42,-6,-38,0,-30);
    g.bezierCurveTo(6,-38,20,-42,30,-26); g.bezierCurveTo(42,-6,30,26,0,40); g.closePath();
    var gr=g.createLinearGradient(0,40,0,-40); gr.addColorStop(0,c1); gr.addColorStop(.55,c2); gr.addColorStop(1,c3);
    g.fillStyle=gr; g.fill();
    g.globalCompositeOperation='source-atop';
    var rg=g.createRadialGradient(-10,-10,4,0,0,46); rg.addColorStop(0,'rgba(255,255,255,.35)'); rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=rg; g.fillRect(-48,-48,96,96);
    g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=1.2; g.stroke();
    return s;
  }
  function novaPetala(inicio){
    var z=0.6+Math.random()*0.8;
    return { x:Math.random()*W, y:inicio? Math.random()*H : -30-Math.random()*H*0.3,
      s:(11+Math.random()*13)*z, vy:(16+Math.random()*20)*z, amp:14+Math.random()*26, fase:Math.random()*6.28,
      vf:0.5+Math.random()*0.7, rot:Math.random()*6.28, vr:(Math.random()-.5)*1.2, flip:Math.random()*6.28, vflip:0.8+Math.random()*1.4,
      a:0.55+Math.random()*0.3, sp:sprites[Math.floor(Math.random()*sprites.length)] };
  }
  function quadroP(t){
    if(!rodando) return;
    if(pausado){ ult=0; requestAnimationFrame(quadroP); return; }
    var dt=ult? Math.min((t-ult)/1000,0.05):0.016; ult=t;
    ctx2.clearRect(0,0,W,H);
    for(var i=0;i<petalas.length;i++){
      var p=petalas[i];
      p.y+=p.vy*dt; p.fase+=p.vf*dt; p.rot+=p.vr*dt; p.flip+=p.vflip*dt;
      var x=p.x+Math.sin(p.fase)*p.amp;
      if(p.y>H+40){ petalas[i]=novaPetala(false); continue; }
      ctx2.save(); ctx2.globalAlpha=p.a; ctx2.translate(x,p.y); ctx2.rotate(p.rot); ctx2.scale(0.35+0.65*Math.abs(Math.cos(p.flip)),1);
      ctx2.drawImage(p.sp,-p.s/2,-p.s/2,p.s,p.s); ctx2.restore();
    }
    requestAnimationFrame(quadroP);
  }
  function iniciarPetalas(){
    if(semMovimento || rodando) return;
    sprites=[ criaSprite('#2f6fcf','#8fbcee','#e9f3fd'), criaSprite('#5b93e0','#b9d6f6','#f6faff'),
              criaSprite('#9cc4f0','#dbeafb','#ffffff'), criaSprite('#e6d3b3','#f4ead8','#fffdf8') ];
    tamanho(); window.addEventListener('resize',tamanho);
    var n=Math.round(Math.min(16,Math.max(9,W*H/42000)));
    for(var i=0;i<n;i++) petalas.push(novaPetala(true));
    rodando=true; requestAnimationFrame(quadroP);
    setTimeout(function(){ cv.classList.add('ativo'); },2200);
  }
})();
</script>
</body>
